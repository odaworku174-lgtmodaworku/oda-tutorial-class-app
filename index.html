    <script>
      // Gracefully handle and suppress Vite HMR WebSocket connection closed warnings in preview environment
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && e.message.includes('WebSocket')) ||
          (e.filename && e.filename.includes('@vite/client'))
        )) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e ? (e.reason || '') : '';
        if (
          String(reason).includes('WebSocket') ||
          String(reason.stack || '').includes('@vite/client')
        ) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
        }
      }, true);
    </script>
